<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#37413e">
    <title>OriginPost — Connection unavailable</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #26302d; background: #f5f1e8; font: 16px/1.5 system-ui, -apple-system, sans-serif; }
      .card { width: min(520px, 100%); padding: 36px; background: #fff; border: 1px solid #dad8d0; border-radius: 22px; box-shadow: 0 20px 60px rgb(41 48 45 / 12%); }
      .mark { display: grid; place-items: center; width: 52px; height: 52px; margin-bottom: 24px; color: #fff; background: #37413e; border-radius: 15px; font-weight: 800; font-size: 24px; }
      h1 { margin: 0 0 10px; font-size: 28px; }
      p { margin: 0; color: #65706c; }
      a { display: inline-grid; place-items: center; min-height: 44px; margin-top: 24px; padding: 0 18px; color: #fff; background: #a0312b; border-radius: 10px; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid #1593a3; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark" aria-hidden="true">O</div>
      <h1>Cannot reach your workspace</h1>
      <p>OriginPost could not connect to its server. Check your connection, or make sure your local installation is running. Your saved content has not been changed.</p>
      <a href="">Try again</a>
    </main>
  </body>
</html>
