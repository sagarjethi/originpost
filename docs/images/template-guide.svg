<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc"><title id="title">What goes into your project template</title><desc id="desc">Original logo, approved visual, exact headline, and social handle. Reference images guide style, not facts.</desc><rect width="1000" height="620" rx="24" fill="#f3f5ef"/><g font-family="Arial,sans-serif"><rect x="35" y="35" width="390" height="550" rx="18" fill="#16252b"/><rect x="60" y="60" width="112" height="48" rx="8" fill="white"/><text x="77" y="90" fill="#223c31" font-size="18">Your logo</text><rect x="60" y="135" width="340" height="220" rx="10" fill="#536c62"/><path d="M75 330l105-120 70 80 60-55 72 95" fill="#9cac8f"/><circle cx="330" cy="185" r="22" fill="#e6d9a2"/><text x="80" y="383" fill="#ccd9d2" font-size="13">ILLUSTRATIVE LAYOUT EXAMPLE</text><text x="60" y="430" fill="white" font-size="30" font-weight="bold">A clear headline.</text><text x="60" y="470" fill="#ecd381" font-size="30" font-weight="bold">The verified detail.</text><text x="60" y="550" fill="#d3ded5" font-size="18">@yourbrand · Source credit</text><text x="470" y="90" fill="#293d2c" font-size="29" font-weight="bold">Your brand, every time.</text><g fill="#52634f" font-size="20"><text x="470" y="155">1. Upload your original logo.</text><text x="470" y="190">Choose its position and size.</text><text x="470" y="260">2. Add images that guide the style.</text><text x="470" y="295">Keep their facts and logos separate.</text><text x="470" y="365">3. Choose writing skills and colours.</text><text x="470" y="400">Save a template for your project.</text><text x="470" y="470">4. Review the text and final image.</text><text x="470" y="505">Then approve the exact post.</text></g></g></svg>