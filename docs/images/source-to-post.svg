<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="title desc"><title id="title">From a news source to a published post</title><desc id="desc">Find, check sources, create, review, publish, and keep proof. People review the post before publishing.</desc><rect width="1200" height="570" rx="24" fill="#f3f5ef"/><g font-family="Arial,sans-serif"><text x="40" y="55" font-size="28" font-weight="bold" fill="#293d2c">One story. A clear path to publication.</text><text x="40" y="85" font-size="16" fill="#52634f">OriginPost keeps your sources, creative work, and decisions together.</text><g transform="translate(40,115)"><rect width="350" height="175" rx="16" fill="white" stroke="#d1dccb"/><text x="20" y="34" font-size="16" fill="#62785b">01</text><text x="20" y="72" font-size="25" font-weight="bold" fill="#293d2c">Find a story</text><text x="20" y="108" font-size="18" fill="#52634f">Your feeds, a news link,</text><text x="20" y="135" font-size="18" fill="#52634f">or text you paste.</text></g><g transform="translate(425,115)"><rect width="350" height="175" rx="16" fill="white" stroke="#d1dccb"/><text x="20" y="34" font-size="16" fill="#62785b">02</text><text x="20" y="72" font-size="25" font-weight="bold" fill="#293d2c">Check the sources</text><text x="20" y="108" font-size="18" fill="#52634f">Read the original report.</text><text x="20" y="135" font-size="18" fill="#52634f">Confirm the key facts.</text></g><g transform="translate(810,115)"><rect width="350" height="175" rx="16" fill="white" stroke="#d1dccb"/><text x="20" y="34" font-size="16" fill="#62785b">03</text><text x="20" y="72" font-size="25" font-weight="bold" fill="#293d2c">Create the post</text><text x="20" y="108" font-size="18" fill="#52634f">Your words, logo, colours,</text><text x="20" y="135" font-size="18" fill="#52634f">and reference images.</text></g><g transform="translate(40,320)"><rect width="350" height="175" rx="16" fill="white" stroke="#d1dccb"/><text x="20" y="34" font-size="16" fill="#62785b">04</text><text x="20" y="72" font-size="25" font-weight="bold" fill="#293d2c">Review together</text><text x="20" y="108" font-size="18" fill="#52634f">Check text, image rights,</text><text x="20" y="135" font-size="18" fill="#52634f">and the exact final draft.</text></g><g transform="translate(425,320)"><rect width="350" height="175" rx="16" fill="white" stroke="#d1dccb"/><text x="20" y="34" font-size="16" fill="#62785b">05</text><text x="20" y="72" font-size="25" font-weight="bold" fill="#293d2c">Publish</text><text x="20" y="108" font-size="18" fill="#52634f">Choose a connected</text><text x="20" y="135" font-size="18" fill="#52634f">social account and time.</text></g><g transform="translate(810,320)"><rect width="350" height="175" rx="16" fill="white" stroke="#d1dccb"/><text x="20" y="34" font-size="16" fill="#62785b">06</text><text x="20" y="72" font-size="25" font-weight="bold" fill="#293d2c">Keep the proof</text><text x="20" y="108" font-size="18" fill="#52634f">See the result, link,</text><text x="20" y="135" font-size="18" fill="#52634f">and publication record.</text></g><text x="40" y="543" font-size="16" fill="#52634f">A collected story is a lead. A generated image is a draft. Publishing needs review and a ready account.</text></g></svg>